name: Пересборка фидов

on:
  schedule:
    - cron: '0 3 * * *'   # каждый день в 03:00 UTC (06:00 по Москве)
  workflow_dispatch:      # и вручную кнопкой Run workflow

permissions:
  contents: write

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Собрать фиды из фида Тильды
        env:
          PYTHONIOENCODING: utf-8
        run: python direct_feed.py --out-dir .

      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elektromontazhnik_direct.yml elektromontazhnik_tovary.xml elektromontazhnik_business.xml
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Автообновление фидов $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
